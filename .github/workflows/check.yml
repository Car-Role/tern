# Type check and tests on every push and pull request.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Front-end tests (file viewers, database text)
        run: npm test
      - name: Git identity for the tests (they make commits in temporary repos)
        run: |
          git config --global user.name "Tern CI"
          git config --global user.email "ci@example.com"
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # The database tool against real servers, in containers.
  databases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tern_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Tern_test_123
        ports: ["1433:1433"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev pkg-config libssl-dev
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do (echo > /dev/tcp/localhost/1433) 2>/dev/null && break; sleep 2; done
          sleep 10
      - name: Database tests
        working-directory: src-tauri
        env:
          TERN_TEST_PG: localhost:5432:postgres:tern_test:postgres
          TERN_TEST_MSSQL: localhost:1433:sa:Tern_test_123:master
          TERN_TEST_REDIS: localhost:6379
        run: "cargo test db:: -- --nocapture"
