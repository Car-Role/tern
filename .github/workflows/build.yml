# Builds Tern for Windows, macOS, and Linux.
#
# - Push a tag like v0.2.0: every build is attached to a draft release named "Tern v0.2.0".
#   Check the draft on GitHub, then publish it.
# - Run it by hand from the Actions tab: the same builds, kept as downloadable files on the run.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files, so Tern only installs updates that come from this repo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Tern {0}', github.ref_name) || '' }}
          releaseBody: |
            Download the file for your system below. See the [install notes](https://github.com/${{ github.repository }}#install) the first time you open Tern.

            | System | File |
            | --- | --- |
            | Windows (most PCs) | `Tern_*_x64-setup.exe` or `Tern_*_x64_en-US.msi` |
            | Windows on ARM | `Tern_*_arm64-setup.exe` |
            | macOS, Apple Silicon (M1 and later) | `Tern_*_aarch64.dmg` |
            | macOS, Intel | `Tern_*_x64.dmg` |
            | Linux x64 | `.AppImage`, `.deb` (Debian, Ubuntu), or `.rpm` (Fedora) with `amd64` / `x86_64` |
            | Linux ARM64 | `.AppImage`, `.deb`, or `.rpm` with `arm64` / `aarch64` |
          releaseDraft: true
          # latest.json tells installed copies of Tern that a new version exists.
          includeUpdaterJson: true

      - uses: actions/upload-artifact@v4
        with:
          name: tern-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
