[package]
name = "tern"
version = "0.1.0"
description = "A fast, keyboard-first app for reviewing many git repos at once"
license = "BUSL-1.1"
repository = "https://github.com/Car-Role/tern"
authors = ["Carl Miller"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name different from the bin name (a Windows cargo issue).
name = "tern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
portable-pty = "0.9"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
